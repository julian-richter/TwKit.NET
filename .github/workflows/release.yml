name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Read version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tag must look like v1.2.3. Got '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Build
        run: dotnet build TwKit.net.slnx --configuration Release

      - name: Pack
        run: dotnet pack TwKit.net/TwKit.net.csproj --configuration Release --output artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/TwKit.net.${{ steps.version.outputs.value }}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
